<!doctype html>
<html>
	<head>
		<title>Kaze Test Harness</title>
		<script src="/kaze/kaze.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script src="/libcurl/index.js"></script>
		<script src="/runway-cleartext-https-transport.js"></script>
	</head>
	<body>
		<h1>Kaze Test Harness</h1>
		<div id="status">Initializing...</div>
		<button id="reload-btn" style="display: none; margin: 8px 0">
			🔄 Reload Test
		</button>
		<iframe
			id="testframe"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");
			const reloadBtn = document.getElementById("reload-btn");
			const { Controller } = $kazeController;
			const LibcurlClient = window.LibcurlTransport.LibcurlClient;

			let controller;
			let kazeFrame;

			async function init() {
				statusEl.textContent = "Registering service worker...";

				const registration = await navigator.serviceWorker.register("/sw.js");

				// Wait for the service worker to be ready
				if (!navigator.serviceWorker.controller) {
					statusEl.textContent = "Waiting for service worker to activate...";
					await new Promise((resolve) => {
						if (registration.active) {
							resolve();
							return;
						}
						const sw = registration.installing || registration.waiting;
						if (sw) {
							sw.addEventListener("statechange", () => {
								if (sw.state === "activated") resolve();
							});
						}
					});
					// Wait for controller
					if (!navigator.serviceWorker.controller) {
						await new Promise((resolve) => {
							navigator.serviceWorker.addEventListener(
								"controllerchange",
								resolve,
								{ once: true }
							);
						});
					}
				}

				statusEl.textContent = "Initializing controller...";

				// same setup the site uses: the transport lives in the fetch worker
				const transport = new $kazeController.WorkerTransport({
					scripts: [
						"/libcurl/index.js",
						"/runway-cleartext-https-transport.js",
					],
					construct: "RunwayWorkerTransport",
					options: { wisp: "ws://localhost:4501/" },
				});
				const cleartext = new BroadcastChannel("runway-cleartext");
				// the worker loads this mapping's listener with the transport, so
				// keep sending until it answers
				window.__runwaySyncCleartext = () =>
					new Promise((resolve) => {
						const payload = () => ({
							hosts: window.__runwayCleartextHttpsHosts,
							site: window.__runwayCleartextSite,
						});
						const retry = setInterval(
							() => cleartext.postMessage(payload()),
							50
						);
						const finish = () => {
							clearInterval(retry);
							resolve();
						};
						const giveUp = setTimeout(finish, 5000);
						cleartext.onmessage = () => {
							clearTimeout(giveUp);
							finish();
						};
						cleartext.postMessage(payload());
					});

				const sw = navigator.serviceWorker.controller ?? registration.active;
				if (!sw) {
					throw new Error("No service worker available for controller");
				}

				controller = new Controller({
					serviceworker: sw,
					transport,
				});
				window.__runwayController = controller;

				await controller.ready;

				kazeFrame = controller.createFrame(testframe);
				window.__runwayKazeFrame = kazeFrame;

				statusEl.textContent = "Ready - waiting for test...";

				window.__runwayNavigate = (url) => {
					statusEl.textContent = `Loading test: ${url}`;
					// Store the URL for reload support
					sessionStorage.setItem("__runway_last_test", url);
					reloadBtn.style.display = "inline-block";
					// injectTestFunctions();
					console.log("navigating to", url);
					kazeFrame.go(url);
				};

				window.__runwayGetProxiedUrl = (url) => {
					return $kaze.rewriteUrl(url, kazeFrame.context, {
						origin: new URL(location.href),
						base: new URL(location.href),
					});
				};

				window.__runwayReload = () => {
					const lastTest = sessionStorage.getItem("__runway_last_test");
					if (lastTest) {
						window.__runwayNavigate(lastTest);
					}
				};

				reloadBtn.addEventListener("click", window.__runwayReload);

				// Auto-navigate to last test on reload
				const lastTest = sessionStorage.getItem("__runway_last_test");
				if (lastTest) {
					console.log("Reloading last test:", lastTest);
					window.__runwayNavigate(lastTest);
				}

				console.log("Harness ready, __runwayNavigate exposed");
			}

			init().catch((err) => {
				statusEl.textContent = `Error: ${err.message}`;
				console.error("Harness init error:", err);
			});
		</script>
	</body>
</html>
