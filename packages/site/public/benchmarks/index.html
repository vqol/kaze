<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>kaze benchmarks</title>
		<link rel="icon" href="data:," />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #eef0f4;
				--card: #ffffff;
				--ink: #08090c;
				--ink-2: #4a4d57;
				--ink-3: #7b7f8c;
				--line: rgba(10, 16, 34, 0.08);
				--bar: #dcdee4;
				--bar-ref: #eceef2;
				--kaze: #5a9df0;
				--scramjet1: #eb6834;
				--scramjet2: #1baf7a;
				--uv: #eda100;
				--glow:
					0 0 0 1px rgba(255, 255, 255, 0.9),
					0 0 44px 8px rgba(255, 255, 255, 0.95),
					0 22px 50px -24px rgba(20, 32, 70, 0.22);
				--ease: cubic-bezier(0.16, 1, 0.3, 1);
			}
			* {
				box-sizing: border-box;
			}
			html {
				scroll-behavior: smooth;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font:
					16px/1.5 Inter,
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
				-webkit-font-smoothing: antialiased;
				overflow-x: hidden;
			}
			.halo {
				position: fixed;
				border-radius: 50%;
				background: radial-gradient(
					closest-side,
					#fff 0%,
					rgba(255, 255, 255, 0.75) 42%,
					rgba(255, 255, 255, 0) 100%
				);
				pointer-events: none;
				z-index: 0;
				will-change: transform;
			}
			.halo.a {
				width: 90vmax;
				height: 90vmax;
				left: -28vmax;
				top: -44vmax;
				animation: drift 26s ease-in-out infinite alternate;
			}
			.halo.b {
				width: 70vmax;
				height: 70vmax;
				right: -24vmax;
				top: 30vh;
				animation: drift 34s ease-in-out infinite alternate-reverse;
			}
			@keyframes drift {
				to {
					transform: translate3d(9vmax, 7vmax, 0) scale(1.14);
				}
			}
			main {
				position: relative;
				z-index: 1;
				max-width: 1080px;
				margin: 0 auto;
				padding: 28px 24px 96px;
			}
			nav {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 16px;
				font-size: 14px;
				color: var(--ink-2);
				flex-wrap: wrap;
			}
			nav a {
				color: inherit;
				text-decoration: none;
				font-weight: 700;
				color: var(--ink);
			}
			.live {
				display: inline-flex;
				gap: 8px;
				align-items: center;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--scramjet2);
				box-shadow: 0 0 0 0 rgba(27, 175, 122, 0.5);
				animation: ping 2.4s var(--ease) infinite;
			}
			@keyframes ping {
				70%,
				100% {
					box-shadow: 0 0 0 9px rgba(27, 175, 122, 0);
				}
			}
			.hero {
				text-align: center;
				padding: 72px 0 40px;
			}
			h1 {
				margin: 0;
				font-size: clamp(84px, 19vw, 188px);
				line-height: 0.95;
				letter-spacing: -0.055em;
				font-weight: 900;
				background: linear-gradient(
						100deg,
						#08090c 38%,
						#9aa3b5 50%,
						#08090c 62%
					)
					0 0 / 260% 100%;
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				filter: drop-shadow(0 0 34px #fff);
				animation: sheen 7s var(--ease) infinite;
			}
			@keyframes sheen {
				from {
					background-position: 130% 0;
				}
				to {
					background-position: -30% 0;
				}
			}
			.tag {
				font-size: clamp(18px, 2.4vw, 23px);
				color: var(--ink-2);
				margin-top: 14px;
			}
			.tag b {
				color: var(--ink);
			}
			.where {
				display: inline-block;
				margin-top: 22px;
				padding: 8px 16px;
				border-radius: 999px;
				background: var(--card);
				box-shadow: var(--glow);
				font-size: 14px;
				font-weight: 600;
			}
			.card {
				background: var(--card);
				border-radius: 22px;
				box-shadow: var(--glow);
				position: relative;
				overflow: hidden;
				opacity: 0;
				transform: translateY(18px);
				transition:
					opacity 0.7s var(--ease),
					transform 0.7s var(--ease);
			}
			.card.in {
				opacity: 1;
				transform: none;
			}
			.card::after {
				content: "";
				position: absolute;
				inset: 0;
				background: radial-gradient(
					240px circle at var(--x, 50%) var(--y, 0%),
					rgba(90, 157, 240, 0.09),
					transparent 70%
				);
				opacity: 0;
				transition: opacity 0.3s;
				pointer-events: none;
			}
			.card:hover::after {
				opacity: 1;
			}
			.board {
				display: grid;
				grid-template-columns: 300px 1fr;
				gap: 12px 44px;
				padding: 36px 40px;
				align-items: center;
			}
			.ring {
				position: relative;
				width: 220px;
				height: 220px;
				margin: 0 auto;
			}
			.ring svg {
				transform: rotate(-90deg);
			}
			.ring circle {
				fill: none;
				stroke-width: 12;
			}
			.ring .track {
				stroke: #eceef2;
			}
			.ring .val {
				stroke: var(--kaze);
				stroke-linecap: round;
				filter: drop-shadow(0 0 8px rgba(90, 157, 240, 0.55));
				transition: stroke-dashoffset 1.6s var(--ease);
			}
			.ring .num {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}
			.ring .num strong {
				font-size: 72px;
				font-weight: 900;
				line-height: 1;
				letter-spacing: -0.04em;
				font-variant-numeric: tabular-nums;
			}
			.ring .num span {
				font-size: 13px;
				color: var(--ink-2);
				margin-top: 4px;
			}
			.row {
				display: grid;
				grid-template-columns: 148px 1fr;
				align-items: center;
				gap: 12px;
				height: 38px;
				font-size: 15px;
			}
			.who {
				display: flex;
				align-items: center;
				gap: 8px;
				white-space: nowrap;
			}
			.who i {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				flex: none;
				background: var(--bar);
			}
			.who.me {
				font-weight: 800;
			}
			.track-b {
				position: relative;
				height: 30px;
				border-radius: 6px;
				cursor: default;
			}
			.fill {
				position: absolute;
				left: 0;
				top: 0;
				bottom: 0;
				width: 0;
				border-radius: 6px;
				background: var(--bar);
				transition: width 1.1s var(--ease);
			}
			.fill.me {
				background: var(--kaze);
				box-shadow: 0 0 22px rgba(90, 157, 240, 0.55);
			}
			.fill.ref {
				background: var(--bar-ref);
			}
			.fill.partial {
				background: repeating-linear-gradient(
					135deg,
					var(--bar) 0 6px,
					var(--bar-ref) 6px 12px
				);
			}
			.txt {
				position: absolute;
				left: 11px;
				top: 0;
				line-height: 30px;
				font-size: 15px;
				font-weight: 600;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
				opacity: 0;
				transition: opacity 0.6s 0.25s;
			}
			.in .txt {
				opacity: 1;
			}
			.me + .txt {
				font-weight: 800;
			}
			.miss {
				font-size: 14px;
				color: var(--ink-3);
			}
			h2 {
				font-size: clamp(30px, 4.4vw, 44px);
				letter-spacing: -0.03em;
				margin: 84px 0 18px;
				font-weight: 800;
			}
			.pills {
				position: sticky;
				top: 0;
				z-index: 5;
				display: flex;
				gap: 6px;
				overflow-x: auto;
				padding: 12px 0;
				scrollbar-width: none;
			}
			.pills::-webkit-scrollbar {
				display: none;
			}
			.pills button {
				flex: none;
				border: 0;
				background: rgba(255, 255, 255, 0.72);
				backdrop-filter: blur(10px);
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				color: var(--ink-2);
				padding: 8px 14px;
				border-radius: 999px;
				cursor: pointer;
				transition:
					background 0.25s,
					color 0.25s,
					box-shadow 0.25s;
			}
			.pills button[aria-selected="true"] {
				background: #fff;
				color: var(--ink);
				box-shadow: var(--glow);
			}
			.pills button:focus-visible {
				outline: 2px solid var(--ink);
			}
			.summary {
				font-size: 18px;
				color: var(--ink-2);
				margin: 10px 2px 20px;
			}
			.summary b {
				color: var(--ink);
			}
			.grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
			}
			.metric {
				padding: 24px 26px 22px;
			}
			.metric h3 {
				margin: 0 0 12px;
				font-size: 17px;
				font-weight: 700;
				display: flex;
				justify-content: space-between;
				gap: 10px;
				align-items: baseline;
			}
			.metric h3 small {
				font-size: 13px;
				font-weight: 600;
				color: var(--ink-3);
				white-space: nowrap;
			}
			.metric h3 small.lead {
				color: var(--ink);
			}
			.metric .row {
				grid-template-columns: 142px 1fr;
				height: 34px;
				font-size: 14px;
			}
			.metric .track-b {
				height: 28px;
			}
			.metric .txt {
				line-height: 28px;
			}
			.note {
				font-size: 13px;
				color: var(--ink-3);
				margin-top: 8px;
			}
			.chart {
				padding: 28px 30px 20px;
			}
			.chart svg {
				width: 100%;
				height: auto;
				display: block;
				overflow: visible;
			}
			.chart .line {
				fill: none;
				stroke-width: 2.5;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-dasharray: 1;
				stroke-dashoffset: 1;
				transition: stroke-dashoffset 1.8s var(--ease);
			}
			.chart.in .line {
				stroke-dashoffset: 0;
			}
			.chart text {
				font-size: 12px;
				fill: var(--ink-2);
				font-family: inherit;
			}
			.chart .end {
				font-size: 13px;
				font-weight: 700;
				fill: var(--ink);
			}
			.chart .gridline {
				stroke: var(--line);
			}
			.chart .cross {
				stroke: var(--ink-3);
				opacity: 0;
			}
			.trail {
				padding: 8px 30px;
			}
			.trail .t {
				display: grid;
				grid-template-columns: 1fr auto auto;
				gap: 18px;
				align-items: baseline;
				padding: 14px 0;
				border-bottom: 1px solid var(--line);
				font-size: 15px;
			}
			.trail .t:last-child {
				border: 0;
			}
			.trail .t b {
				font-variant-numeric: tabular-nums;
				font-weight: 800;
			}
			.trail .t span {
				color: var(--ink-2);
				font-variant-numeric: tabular-nums;
			}
			.method {
				padding: 26px 30px;
				font-size: 15px;
				color: var(--ink-2);
			}
			.method p {
				margin: 0 0 12px;
			}
			details summary {
				cursor: pointer;
				font-weight: 700;
				color: var(--ink);
			}
			table {
				border-collapse: collapse;
				width: 100%;
				font-size: 13px;
				margin-top: 14px;
				font-variant-numeric: tabular-nums;
			}
			th,
			td {
				padding: 6px 8px;
				text-align: right;
				border-bottom: 1px solid var(--line);
				white-space: nowrap;
			}
			th:first-child,
			td:first-child {
				text-align: left;
				white-space: normal;
			}
			.scroll {
				overflow-x: auto;
			}
			#tip {
				position: fixed;
				z-index: 20;
				pointer-events: none;
				background: #fff;
				color: var(--ink);
				padding: 8px 12px;
				border-radius: 10px;
				font-size: 13px;
				box-shadow:
					0 0 0 1px var(--line),
					0 12px 30px -8px rgba(20, 32, 70, 0.3);
				opacity: 0;
				transition: opacity 0.15s;
				max-width: 280px;
			}
			#toast {
				position: fixed;
				left: 50%;
				bottom: 26px;
				transform: translate(-50%, 80px);
				background: #fff;
				padding: 12px 20px;
				border-radius: 999px;
				font-weight: 700;
				font-size: 14px;
				box-shadow:
					var(--glow),
					0 0 0 1px var(--line);
				transition:
					transform 0.6s var(--ease),
					opacity 0.4s;
				opacity: 0;
				z-index: 30;
			}
			#toast.on {
				opacity: 1;
				transform: translate(-50%, 0);
			}
			@media (max-width: 780px) {
				main {
					padding: 20px 16px 72px;
				}
				.board {
					grid-template-columns: 1fr;
					padding: 26px 18px;
				}
				.grid {
					grid-template-columns: 1fr;
				}
				.row,
				.metric .row {
					grid-template-columns: 132px 1fr;
				}
				.chart,
				.trail,
				.method {
					padding-left: 18px;
					padding-right: 18px;
				}
				.chart {
					overflow-x: auto;
				}
				.chart svg {
					min-width: 640px;
				}
				.trail .t {
					grid-template-columns: 1fr auto;
					gap: 2px 14px;
				}
				.trail .t span {
					grid-row: 2;
					grid-column: 1 / -1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
				}
				html {
					scroll-behavior: auto;
				}
				h1 {
					background: #08090c;
					-webkit-background-clip: text;
					background-clip: text;
				}
			}
		</style>
	</head>
	<body>
		<div class="halo a"></div>
		<div class="halo b"></div>
		<main>
			<nav>
				<a href="/">kaze</a>
				<span class="live"
					><i class="dot"></i><span id="updated">Loading results</span></span
				>
			</nav>

			<header class="hero">
				<h1>kaze</h1>
				<div class="tag" id="tag"></div>
				<div class="where" id="where"></div>
			</header>

			<section class="card board" id="board" aria-label="Overall score">
				<div class="ring">
					<svg
						viewBox="0 0 220 220"
						width="220"
						height="220"
						aria-hidden="true"
					>
						<circle class="track" cx="110" cy="110" r="96"></circle>
						<circle class="val" id="ringval" cx="110" cy="110" r="96"></circle>
					</svg>
					<div class="num">
						<strong id="score">0</strong><span>overall score</span>
					</div>
				</div>
				<div id="leader"></div>
			</section>

			<h2>Every test</h2>
			<div class="pills" id="pills" role="tablist"></div>
			<div class="summary" id="summary"></div>
			<div class="grid" id="metrics"></div>

			<h2>Progress</h2>
			<section
				class="card chart"
				id="chart"
				aria-label="Overall score by benchmark run"
			></section>

			<h2>Where kaze still trails</h2>
			<section class="card trail" id="trail"></section>

			<h2>How this is measured</h2>
			<section class="card method" id="method"></section>
		</main>
		<div id="tip" role="status"></div>
		<div id="toast">New benchmark results</div>

		<script>
			const $ = (id) => document.getElementById(id);
			const esc = (s) =>
				String(s).replace(
					/[&<>"']/g,
					(c) =>
						({
							"&": "&amp;",
							"<": "&lt;",
							">": "&gt;",
							'"': "&quot;",
							"'": "&#39;",
						})[c]
				);
			const COLORS = {
				kaze: "var(--kaze)",
				scramjet1: "var(--scramjet1)",
				scramjet2: "var(--scramjet2)",
				uv: "var(--uv)",
			};
			const SHORT = {
				scramjet1: "Scramjet 1.1",
				scramjet2: "Scramjet 2",
				uv: "Ultraviolet",
				bare: "Chrome (no proxy)",
				kaze: "kaze",
			};
			let data, history, active;

			const reveal = new IntersectionObserver(
				(entries) => {
					for (const e of entries) {
						if (!e.isIntersecting) continue;
						e.target.classList.add("in");
						e.target.querySelectorAll("[data-w]").forEach((el, i) => {
							el.style.transitionDelay = i * 45 + "ms";
							el.style.width = el.dataset.w;
						});
						reveal.unobserve(e.target);
					}
				},
				{ threshold: 0.12 }
			);
			const watch = (root) =>
				root.querySelectorAll(".card").forEach((c) => reveal.observe(c));

			function countUp(el, to) {
				if (matchMedia("(prefers-reduced-motion: reduce)").matches)
					return void (el.textContent = Math.round(to));
				const start = performance.now();
				const tick = (t) => {
					const p = Math.min(1, (t - start) / 1500);
					el.textContent = Math.round(to * (1 - Math.pow(1 - p, 4)));
					if (p < 1) requestAnimationFrame(tick);
				};
				requestAnimationFrame(tick);
			}

			function who(id) {
				const dot = COLORS[id]
					? `<i style="background:${COLORS[id]}"></i>`
					: "<i></i>";
				return `<div class="who${id === "kaze" ? " me" : ""}">${dot}${esc(SHORT[id] ?? id)}</div>`;
			}

			function barRow(id, width, text, cls, tip) {
				return `<div class="row">${who(id)}<div class="track-b" data-tip="${esc(tip)}"><div class="fill ${cls}" data-w="${width}%"></div><div class="txt">${esc(text)}</div></div></div>`;
			}

			function renderHero() {
				const engines = Object.entries(data.overall).sort(
					(a, b) => b[1] - a[1]
				);
				const k = data.overall.kaze;
				const lead = engines[0][0] === "kaze";
				$("tag").innerHTML = lead
					? `<b>Highest overall score</b>, fastest in <b>${data.wins.kaze} of ${data.totalMetrics}</b> tests`
					: `Fastest in <b>${data.wins.kaze} of ${data.totalMetrics}</b> tests`;
				$("where").textContent = data.conditions.wisp.startsWith("ws")
					? "Tested through " + data.conditions.wisp
					: "Tested on a local wisp server";
				$("updated").textContent =
					"Updated " +
					new Date(data.updated).toLocaleString([], {
						dateStyle: "medium",
						timeStyle: "short",
					});
				const c = 2 * Math.PI * 96;
				const ring = $("ringval");
				ring.style.strokeDasharray = c;
				ring.style.strokeDashoffset = c;
				requestAnimationFrame(() =>
					requestAnimationFrame(
						() => (ring.style.strokeDashoffset = c * (1 - k / 100))
					)
				);
				countUp($("score"), k);
				$("leader").innerHTML = engines
					.map(([id, v]) =>
						barRow(
							id,
							v.toFixed(1),
							Math.round(v) + "  ·  " + (data.wins[id] ?? 0) + " wins",
							id === "kaze" ? "me" : "",
							`${SHORT[id]}: score ${Math.round(v)} of 100, fastest in ${data.wins[id] ?? 0} tests`
						)
					)
					.join("");
			}

			function versusKaze(metric, id, entry) {
				const k = metric.values.kaze;
				if (id === "kaze" || !k) return `${SHORT[id]}: ${entry.text}`;
				const r = metric.better === "lower" ? entry.v / k.v : k.v / entry.v;
				const dir =
					r >= 1
						? `kaze is ${r.toFixed(2)}× faster`
						: `${(1 / r).toFixed(2)}× faster than kaze`;
				return `${SHORT[id]}: ${entry.text}, ${dir}`;
			}

			function metricCard(m) {
				const order = data.engines.map((e) => e.id);
				const max = Math.max(...order.map((id) => m.values[id]?.v ?? 0));
				const rows = order
					.map((id) => {
						const e = m.values[id];
						if (!e)
							return `<div class="row">${who(id)}<div class="miss">${id === "bare" ? "n/a" : "failed"}</div></div>`;
						const cls = [
							id === "kaze" ? "me" : id === "bare" ? "ref" : "",
							e.incomplete ? "partial" : "",
						].join(" ");
						return barRow(
							id,
							((e.v / max) * 100).toFixed(1),
							e.text + (e.incomplete ? "  (incomplete)" : ""),
							cls,
							versusKaze(m, id, e) +
								(e.incomplete
									? ". Page did not fully load, so it can't win."
									: "")
						);
					})
					.join("");
				let chip = "";
				if (m.winner === "kaze") {
					const others = order.filter(
						(id) =>
							id !== "kaze" &&
							id !== "bare" &&
							m.values[id] &&
							!m.values[id].incomplete
					);
					const k = m.values.kaze.v;
					const ratios = others.map((id) =>
						m.better === "lower" ? m.values[id].v / k : k / m.values[id].v
					);
					if (ratios.length)
						chip = `<small class="lead">${Math.min(...ratios).toFixed(2)}× ahead</small>`;
				} else if (m.winner) {
					chip = `<small>${esc(SHORT[m.winner])} fastest</small>`;
				}
				const hint =
					m.better === "higher"
						? `<div class="note">Longer is better</div>`
						: "";
				return `<article class="card metric"><h3><span>${esc(m.label.replace(/ — .*/, ""))}</span>${chip}</h3>${rows}${hint}</article>`;
			}

			function renderPills() {
				$("pills").innerHTML = data.categories
					.map(
						(c, i) =>
							`<button role="tab" aria-selected="${c.name === active}" data-i="${i}">${esc(c.name)}</button>`
					)
					.join("");
			}

			function renderCategory() {
				const cat =
					data.categories.find((c) => c.name === active) ?? data.categories[0];
				active = cat.name;
				renderPills();
				const won = cat.metrics.filter((m) => m.winner === "kaze").length;
				const score = cat.scores.kaze;
				$("summary").innerHTML =
					`kaze scores <b>${Math.round(score ?? 0)}</b> here and is fastest in <b>${won} of ${cat.metrics.length}</b>`;
				$("metrics").innerHTML = cat.metrics.map(metricCard).join("");
				watch($("metrics"));
			}

			function renderChart() {
				const W = 960,
					H = 300,
					L = 34,
					R = 118,
					T = 14,
					B = 34;
				const n = history.length;
				const x = (i) => (n < 2 ? L : L + (i / (n - 1)) * (W - L - R));
				const y = (v) => T + (1 - v / 100) * (H - T - B);
				const ids = ["kaze", "uv", "scramjet2", "scramjet1"];
				let grid = "";
				for (const v of [0, 25, 50, 75, 100])
					grid += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
				const ends = ids
					.map((id) => ({ id, v: history[n - 1].overall[id] ?? 0 }))
					.sort((a, b) => b.v - a.v);
				let last = -Infinity;
				const lines = ids
					.map((id) => {
						const pts = history
							.map((h, i) =>
								h.overall[id] == null
									? null
									: `${x(i).toFixed(1)},${y(h.overall[id]).toFixed(1)}`
							)
							.filter(Boolean)
							.join(" ");
						return `<polyline class="line" pathLength="1" points="${pts}" style="stroke:${COLORS[id]}${id === "kaze" ? ";stroke-width:4" : ""}"></polyline>`;
					})
					.join("");
				const labels = ends
					.map((e) => {
						let py = y(e.v) + 4;
						if (py - last < 16) py = last + 16;
						last = py;
						return `<text class="end" x="${W - R + 10}" y="${py}">${esc(SHORT[e.id])} ${Math.round(e.v)}</text>`;
					})
					.join("");
				const first = new Date(history[0].date).toLocaleDateString();
				const lastD = new Date(history[n - 1].date).toLocaleDateString();
				$("chart").innerHTML =
					`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall score for each engine over ${n} benchmark runs">
					${grid}${lines}${labels}
					<line class="cross" id="cross" y1="${T}" y2="${H - B}"></line>
					<text x="${L}" y="${H - 10}">${esc(first)}</text>
					<text x="${W - R}" y="${H - 10}" text-anchor="end">${esc(lastD)}</text>
					<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"></rect>
				</svg><div class="note">Overall score by benchmark run. Scores are relative to the fastest engine in that run.</div>`;
				reveal.observe($("chart"));
				const svg = $("chart").querySelector("svg");
				$("hit").addEventListener("pointermove", (ev) => {
					const b = svg.getBoundingClientRect();
					const vx = ((ev.clientX - b.left) / b.width) * W;
					const i = Math.max(
						0,
						Math.min(n - 1, Math.round(((vx - L) / (W - L - R)) * (n - 1)))
					);
					const h = history[i];
					$("cross").setAttribute("x1", x(i));
					$("cross").setAttribute("x2", x(i));
					$("cross").style.opacity = 1;
					showTip(
						ev,
						`<b>${esc(h.label ?? new Date(h.date).toLocaleString())}</b><br>` +
							ids
								.map(
									(id) => `${esc(SHORT[id])}: ${Math.round(h.overall[id] ?? 0)}`
								)
								.join("<br>"),
						true
					);
				});
				$("hit").addEventListener("pointerleave", () => {
					$("cross").style.opacity = 0;
					hideTip();
				});
			}

			function renderTrail() {
				const rows = [];
				for (const c of data.categories)
					for (const m of c.metrics) {
						if (!m.winner || m.winner === "kaze" || !m.values.kaze) continue;
						const k = m.values.kaze,
							w = m.values[m.winner];
						rows.push({
							m,
							c,
							w,
							k,
							r: m.better === "lower" ? k.v / w.v : w.v / k.v,
						});
					}
				rows.sort((a, b) => b.r - a.r);
				$("trail").innerHTML = rows.length
					? rows
							.map(
								({ m, w, k, r }) =>
									`<div class="t"><div>${esc(m.label)}</div><span>${esc(k.text)} vs ${esc(w.text)} (${esc(SHORT[m.winner])})</span><b>${r.toFixed(2)}×</b></div>`
							)
							.join("")
					: `<div class="t"><div>kaze is fastest in every test.</div></div>`;
				reveal.observe($("trail"));
			}

			function renderMethod() {
				const c = data.conditions;
				const ids = data.engines.map((e) => e.id);
				const body = data.categories
					.flatMap((cat) => cat.metrics)
					.map(
						(m) =>
							`<tr><td>${esc(m.label)}</td>${ids.map((id) => `<td>${esc(m.values[id]?.text ?? "–")}</td>`).join("")}</tr>`
					)
					.join("");
				$("method").innerHTML = `
					<p>${esc(c.wisp)}. ${esc(c.chrome ? "Chrome " + c.chrome.split(".")[0] : "Chrome")} on ${esc(c.cpu ?? "unknown CPU")}. Page loads are the median of ${esc(c.runs)} fresh sessions; in-page tests the median of ${esc(c.microSessions)}.</p>
					<p>Score: for each test, an engine gets its speed relative to the fastest engine; categories average those, and the overall score averages the categories. A test an engine can't run counts heavily against it.</p>
					<p>A page load that renders under 95% of the elements plain Chrome renders is marked incomplete and can't win, so a page that broke can't look fast.</p>
					<details><summary>All numbers</summary><div class="scroll"><table>
						<thead><tr><th>Test</th>${ids.map((id) => `<th>${esc(SHORT[id])}</th>`).join("")}</tr></thead>
						<tbody>${body}</tbody></table></div></details>`;
				reveal.observe($("method"));
			}

			function showTip(ev, html, raw) {
				const t = $("tip");
				if (raw) t.innerHTML = html;
				else t.textContent = html;
				t.style.opacity = 1;
				const x = Math.min(innerWidth - 300, ev.clientX + 14);
				t.style.left = Math.max(8, x) + "px";
				t.style.top = ev.clientY + 18 + "px";
			}
			const hideTip = () => ($("tip").style.opacity = 0);

			document.addEventListener("pointermove", (ev) => {
				const card = ev.target.closest?.(".card");
				if (card) {
					const b = card.getBoundingClientRect();
					card.style.setProperty("--x", ev.clientX - b.left + "px");
					card.style.setProperty("--y", ev.clientY - b.top + "px");
				}
				const tr = ev.target.closest?.("[data-tip]");
				if (tr) showTip(ev, tr.dataset.tip);
				else if (!ev.target.closest?.("#hit")) hideTip();
			});
			$("pills").addEventListener("click", (ev) => {
				const b = ev.target.closest("button");
				if (!b) return;
				active = data.categories[b.dataset.i].name;
				renderCategory();
			});

			function renderAll() {
				active ??= data.categories[0].name;
				renderHero();
				renderCategory();
				renderChart();
				renderTrail();
				renderMethod();
				watch(document);
			}

			async function load() {
				const opts = { cache: "no-cache" };
				const [latest, hist] = await Promise.all([
					fetch("data/latest.json", opts).then((r) => r.json()),
					fetch("data/history.json", opts).then((r) => r.json()),
				]);
				const changed = data && data.updated !== latest.updated;
				if (changed || !data) {
					data = latest;
					history = hist;
					renderAll();
					if (changed) {
						$("toast").classList.add("on");
						setTimeout(() => $("toast").classList.remove("on"), 4000);
					}
				}
			}
			load().catch(
				(e) => ($("updated").textContent = "Could not load results")
			);
			setInterval(() => load().catch(() => {}), 30000);
		</script>
	</body>
</html>
